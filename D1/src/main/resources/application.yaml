server:
  port: 9090
  servlet:
    context-path: /api/v1/tienda

spring:
  application:
    name: tienda
  datasource:
    # Todo sale de variables de entorno; los valores por defecto son solo para desarrollo local
    url: "${DB_URL:jdbc:mysql://localhost:3306/tienda_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: none      # el esquema lo crea tienda.sql, Hibernate no toca las tablas
    open-in-view: false
    show-sql: false

app:
  jwt:
    # Obligatorio: sin JWT_SECRET la aplicación no arranca (no hay secreto en el repositorio)
    secret: "${JWT_SECRET}"
    # Minutos de vida del token; 10 por defecto
    expiration-minutes: "${JWT_EXPIRATION_MINUTES:10}"
